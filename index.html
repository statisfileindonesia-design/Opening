<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CLICKS - OPENING (ATARI BULL)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', 'Courier New', monospace;
    }
    .opening {
      text-align: center;
      background: black;
      padding: 30px 20px;
      max-width: 600px;
    }
    /* CLICKS ATARI */
    .clicks {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 3.2rem;
      font-weight: normal;
      color: #ff0000;
      text-shadow: 5px 5px 0 #660000, 2px 2px 0 #000;
      letter-spacing: 2px;
      margin-bottom: 25px;
      transform: scaleY(1.08);
    }
    /* Pembungkus canvas banteng (agar bisa rotateY) */
    .bull-wrap {
      margin: 20px auto;
      perspective: 500px;
      display: inline-block;
    }
    #bullCanvas {
      display: block;
      width: 160px;
      height: 160px;
      image-rendering: pixelated;
      box-shadow: 0 0 0 3px #3a0000, 0 0 15px #aa0000;
      border-radius: 8px;
      background: black;
      transition: transform 0.05s linear;
    }
    /* Teks handwriting kecil dengan font Atari */
    .handwriting {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 0.7rem;
      color: #ff8888;
      margin: 25px 0 15px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #330000;
      transform: rotate(-1.5deg) skewX(-3deg);
      opacity: 0.9;
      word-spacing: -1px;
      line-height: 1.4;
    }
    .progress-area {
      width: 280px;
      margin: 20px auto 0;
    }
    .progress-bg {
      background: #1a0000;
      height: 14px;
      border: 2px solid #ff3333;
      box-shadow: inset 0 0 6px black;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ff0000;
      box-shadow: 0 0 10px #ff5555;
    }
    .timer {
      font-family: 'Press Start 2P', monospace;
      color: #aa5555;
      margin-top: 8px;
      font-size: 10px;
    }
  </style>
</head>
<body>
<div class="opening" id="openingScreen">
  <div class="clicks">CLICKS</div>

  <!-- Kepala banteng 8-bit dengan efek melihat kiri-kanan -->
  <div class="bull-wrap">
    <canvas id="bullCanvas" width="128" height="128"></canvas>
  </div>

  <div class="handwriting">We Are Connected To Each Other</div>

  <div class="progress-area">
    <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
    <div class="timer" id="timerDisplay">0.00 s</div>
  </div>
</div>

<script>
  // ========== GAMBAR KEPALA BANTENG 8-BIT ==========
  const bullCanvas = document.getElementById('bullCanvas');
  const ctx = bullCanvas.getContext('2d');
  const CELL = 4;
  const W = 32, H = 32;
  const PAL = {
    BG:'#000000', DK_BROWN:'#4a2a1a', BROWN:'#7a4a2a', LT_BROWN:'#b87c4a',
    DARK_RED:'#8b2c1a', HORN:'#b0b0b0', HORN_SHADOW:'#7a7a7a',
    EYE:'#f0f0f0', PUPIL:'#000000', OUTLINE:'#2e1a0e'
  };
  let grid = Array(H).fill().map(()=>Array(W).fill('BG'));
  function fill(y1,y2,x1,x2,col){
    for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(y>=0&&y<H&&x>=0&&x<W)grid[y][x]=col;
  }
  // Desain kepala banteng 8-bit (sama seperti sebelumnya)
  fill(8,26,8,24,'BROWN');
  fill(12,20,6,8,'LT_BROWN');
  fill(12,20,24,26,'LT_BROWN');
  fill(4,7,7,11,'HORN');
  fill(5,6,5,7,'HORN');
  fill(3,5,8,10,'HORN_SHADOW');
  fill(4,7,21,25,'HORN');
  fill(5,6,25,27,'HORN');
  fill(3,5,22,24,'HORN_SHADOW');
  fill(12,15,9,13,'EYE');
  fill(12,15,19,23,'EYE');
  fill(13,14,10,12,'PUPIL');
  fill(13,14,20,22,'PUPIL');
  fill(12,13,10,11,'EYE');
  fill(12,13,20,21,'EYE');
  fill(19,23,12,20,'DARK_RED');
  fill(20,22,13,15,'PUPIL');
  fill(20,22,17,19,'PUPIL');
  fill(15,18,15,17,'DK_BROWN');
  fill(10,12,8,13,'DK_BROWN');
  fill(10,12,19,24,'DK_BROWN');
  fill(6,9,12,20,'DK_BROWN');
  fill(8,13,3,6,'BROWN');
  fill(8,13,26,29,'BROWN');
  fill(14,18,7,8,'OUTLINE');
  fill(14,18,24,25,'OUTLINE');
  fill(22,25,12,20,'OUTLINE');
  fill(25,27,10,22,'DK_BROWN');
  fill(23,24,15,17,'PUPIL');
  function renderBull(){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)ctx.fillStyle=PAL[grid[y][x]]||'#000',ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  }
  renderBull();

  // ========== ANIMASI MELIHAT KIRI KANAN (ROTATE Y) ==========
  const bullElem = document.getElementById('bullCanvas');
  let animTime = 0;
  let lastTimestamp = null;

  function animateHead(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
    lastTimestamp = timestamp;
    animTime += dt;

    // Siklus 4 detik, gerakan halus
    const cycle = (animTime % 4) / 4; // 0 -> 1
    let angle = 0;
    if (cycle < 0.25) {
      angle = -15 * (cycle / 0.25); // ke kiri
    } else if (cycle < 0.5) {
      angle = -15 * (1 - (cycle - 0.25) / 0.25); // kembali tengah
    } else if (cycle < 0.75) {
      angle = 15 * ((cycle - 0.5) / 0.25); // ke kanan
    } else {
      angle = 15 * (1 - (cycle - 0.75) / 0.25); // kembali tengah
    }
    bullElem.style.transform = `rotateY(${angle}deg)`;
    requestAnimationFrame(animateHead);
  }
  requestAnimationFrame(animateHead);

  // ========== PROGRESS BAR & REDIRECT ==========
  const progressFill = document.getElementById('progressFill');
  const timerSpan = document.getElementById('timerDisplay');
  const container = document.getElementById('openingScreen');
  let start = null, animFrame = null, done = false;
  const DUR = 4000;
  const FB = 'https://kucluk25.pages.dev';

  function updateProgress(ts) {
    if (!start) start = ts;
    const elapsed = ts - start;
    let p = Math.min(1, elapsed / DUR);
    progressFill.style.width = (p * 100) + '%';
    timerSpan.innerText = (elapsed / 1000).toFixed(2) + ' s';

    if (p >= 1 && !done) {
      done = true;
      cancelAnimationFrame(animFrame);
      progressFill.style.width = '100%';
      timerSpan.innerText = '4.00 s';
      container.style.transition = 'opacity 0.5s';
      container.style.opacity = '0';
      setTimeout(() => { window.location.href = FB; }, 500);
      return;
    }
    animFrame = requestAnimationFrame(updateProgress);
  }
  animFrame = requestAnimationFrame(updateProgress);
</script>
</body>
</html>
